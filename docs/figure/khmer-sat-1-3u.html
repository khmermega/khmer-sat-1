.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

" aria-hidden="true"><path d="M1.5 5h13"/></svg>Solar cells on the body and two deployable two-panel wings</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Camera lights in IMAGING, UHF antennas in DOWNLINK</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Remove-before-flight tag, pulled before launch</span></span><span class="iso-caption">The 3U CubeSat as specified: 100 × 100 × 340.5 mm. Wing size, cell layout, antennas and optics are illustrative, because the real parts are still to be selected (docs/hardware-bom.md). The modes and the 5 s imaging hold are the flight software's own; the green LED on the end face blinks with the 1 s watchdog heartbeat.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
