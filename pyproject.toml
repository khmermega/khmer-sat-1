[project]
name = "khmer-sat-1"
version = "0.1.0"
description = "KHMER-SAT 1 - Cambodian Earth Observation 3U CubeSat engineering prototype (NOT flight qualified)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "sgp4>=2.23",
  "numpy>=1.26",
  "pillow>=10.4",
  "boto3>=1.34",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
# Hardware adapters - only needed on the prototype onboard computer.
hardware = ["opencv-python-headless>=4.10", "pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "ground-station/backend"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "hil: hardware-in-the-loop test (requires real hardware; skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ground-station/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
extend-safe-fixes = ["I001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "simulator", "onboard", "app", "conftest"]
